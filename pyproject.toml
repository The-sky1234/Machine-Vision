[project]
name = "fabqc"
version = "0.1.0"
description = "YOLO steel-surface inspection on real images plus deterministic timeline RCA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ultralytics>=8.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
fabqc = "fabqc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabqc*"]

[tool.setuptools.package-data]
fabqc = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
